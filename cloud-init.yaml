#cloud-config

package_update: true

packages:
  - docker.io

runcmd:
  - systemctl enable --now docker
  - docker pull ghcr.io/bishalraktim/azure-auto-healing-web-tier:latest
  - docker rm -f web || true
  - docker run -d --name web --restart unless-stopped -p 80:80 ghcr.io/bishalraktim/azure-auto-healing-web-tier:latest
